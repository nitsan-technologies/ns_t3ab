name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature for T3AB – TYPO3 AI Builder (`ns_t3ab`)!

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear description of the feature you'd like
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem this would solve
      placeholder: I want to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions you've considered
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Content Blocks
        - AI Forms
        - AI model / provider
        - Extension configuration
        - Documentation
        - Other
    validations:
      required: true
